services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: brandpilot
      POSTGRES_USER: brandpilot
      POSTGRES_PASSWORD: brandpilot
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brandpilot -d brandpilot"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - brandpilot_postgres:/var/lib/postgresql/data

volumes:
  brandpilot_postgres:
