[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "falkrona"
version = "0.0.1"
description = "Application contracts and services for Falkrona, Your Brand's Pilot"
requires-python = ">=3.13,<3.14"
license = { text = "Proprietary" }
dependencies = [
  "alembic>=1.16,<2",
  "argon2-cffi>=25.1,<26",
  "cryptography>=46.0,<47",
  "defusedxml>=0.7,<1",
  "fastapi>=0.137,<0.138",
  "openpyxl>=3.1,<4",
  "Pillow>=11,<12",
  "pypdf>=6,<7",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.13,<3",
  "sqlalchemy>=2.0.51,<2.1",
  "uvicorn>=0.49,<0.50",
  "rembg[cpu]>=2.0,<3",
]

[dependency-groups]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=9.1,<10",
]

[tool.setuptools]
package-dir = { "" = "packages/brandpilot_core/src" }

[tool.setuptools.packages.find]
where = ["packages/brandpilot_core/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
